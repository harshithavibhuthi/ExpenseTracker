<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">₹</div>
    <div class="auth-title">Create account</div>
    <div class="auth-subtitle">Start tracking your expenses today</div>
    {% if error_message %}
    <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}
    <form method="POST" action="/register" class="auth-form">
      <div class="form-row">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a strong password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create account</button>
    </form>
    <div class="auth-divider">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>
</body>
</html>
